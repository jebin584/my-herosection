<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    #hero_area {
      background-image: url(bg2.jpg);
      background-size: cover;
      padding: 100px 30px;
      text-align: center;
      font-family: sans-serif;
      position: relative;
      z-index: 1;

    
    }
    #hero_area h1 {
      color: white;
      font-size: 40px;
      margin-bottom: 0;

    }
    #hero_area p {
      color: azure;
      font-size: 15px;
      margin-bottom: 0;
    }
    #hero_area .btn {
    background: #c0392b;
    font-size: 14px;
    padding: 10px 15px;
    margin-top: 25px;
    color: azure;
    text-decoration: none;
    display: inline-block;
    border-radius: 6px;
    
    }
    #hero_area .btn:hover {
      background: #2c3e50;
    }
    .bg {
      position: absolute;
      background: black;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      opacity: 0.4;
      z-index: -1;


    }

  </style>
</head>
<body>
  <section id="hero_area">
 <h1>HELLO</h1>
    <div class="bg"></div>

  

    <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Harum vel blanditiis quod labore modi! Hic.</p>

    <a class="btn" href="">Contact</a>

  </section>
</body>
</html>
